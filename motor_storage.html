<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="只比對 Excel E 欄與 Z 欄關鍵字查詢馬達資料，其他欄位保留供參考。">
    <title>馬達資料查詢</title>
    <link rel="stylesheet" href="motor_storage.css">
</head>
<body>
    <header class="page-header">
        <a class="back-link" href="index.html" target="_top" aria-label="返回網站首頁">← 網站首頁</a>
        <p class="eyebrow">W261 MOTOR INVENTORY</p>
        <h1>馬達資料查詢</h1>
        <p class="intro">只比對 Excel 的 E 欄與 Z 欄；其他欄位仍列在結果中供參考。</p>
    </header>

    <main class="page-content">
        <section class="search-panel" aria-label="搜尋馬達資料">
            <label for="searchInput">關鍵字</label>
            <div class="search-row">
                <input id="searchInput" type="search" placeholder="例如：E 欄 CONVEYOR G1、Z 欄 604100186323" autocomplete="off" spellcheck="false">
                <button id="clearButton" type="button" class="clear-button" hidden>清除</button>
            </div>
            <div class="filter-row">
                <label for="sheetFilter">資料分類</label>
                <select id="sheetFilter" disabled>
                    <option value="">全部分類</option>
                </select>
                <span id="searchHint" class="search-hint">只搜尋 E 欄與 Z 欄；其他欄位會保留在完整資料中參考。多個關鍵字以空白分隔。</span>
            </div>
        </section>

        <section class="results-section" aria-label="搜尋結果">
            <div class="results-heading">
                <h2>查詢結果</h2>
                <p id="resultStatus" role="status" aria-live="polite">尚未搜尋資料</p>
            </div>
            <div id="results" class="results-list"></div>
            <nav id="pagination" class="pagination" aria-label="搜尋結果分頁" hidden>
                <button id="previousPage" type="button">上一頁</button>
                <span id="pageStatus"></span>
                <button id="nextPage" type="button">下一頁</button>
            </nav>
        </section>
        <p class="data-note">資料來源：motor_storage_W261_1019_merged_trimmed（1019 版）</p>
    </main>

    <script src="motor_storage.js"></script>
</body>
</html>
