<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="依地點、設備名稱、MCC 名稱、盤面位置或備註查詢 MCC 設備資料。">
    <title>MCC 設備查詢</title>
    <link rel="stylesheet" href="motor_storage.css">
</head>
<body>
    <header class="page-header">
        <a class="back-link" href="index.html" target="_top" aria-label="返回網站首頁">← 網站首頁</a>
        <p class="eyebrow">MCC EQUIPMENT DIRECTORY</p>
        <h1>MCC 設備查詢</h1>
        <p class="intro">搜尋地點、設備名稱、MCC 名稱、盤面位置或備註，快速找到設備所在位置。</p>
    </header>

    <main class="page-content">
        <section class="search-panel" aria-label="搜尋 MCC 設備">
            <label for="searchInput">關鍵字</label>
            <div class="search-row">
                <input id="searchInput" type="search" placeholder="例如：推焦車、MCC1、14D、FFRC-502" autocomplete="off" spellcheck="false">
                <button id="clearButton" type="button" class="clear-button" hidden>清除</button>
            </div>
            <div class="filter-row">
                <label for="locationFilter">設備地點</label>
                <select id="locationFilter" disabled>
                    <option value="">全部地點</option>
                </select>
                <span class="search-hint">輸入關鍵字後才載入結果；多個關鍵字以空白分隔，需同時符合。</span>
            </div>
        </section>

        <section class="results-section" aria-label="MCC 查詢結果">
            <div class="results-heading">
                <h2>查詢結果</h2>
                <p id="resultStatus" role="status" aria-live="polite">尚未搜尋資料</p>
            </div>
            <div id="results" class="results-list"></div>
            <nav id="pagination" class="pagination" aria-label="搜尋結果分頁" hidden>
                <button id="previousPage" type="button">上一頁</button>
                <span id="pageStatus"></span>
                <button id="nextPage" type="button">下一頁</button>
            </nav>
        </section>
        <p class="data-note">資料來源：MCC 設備列表</p>
    </main>

    <script src="mcc-search.js?v=search-page-20261019"></script>
</body>
</html>
