<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>電子地圖</title>
    <link rel="stylesheet" href="electronic-map.css">
    <link rel="stylesheet" href="scrollbar-styles.css">
    <link rel="stylesheet" href="dark-theme.css">
</head>
<body>
    <main class="map-page">
        <header class="map-header">
            <div>
                <p class="map-eyebrow">廠區參考資料</p>
                <h1>電子地圖</h1>
            </div>
            <a class="map-home-link" href="welcome.html" target="contentFrame">回首頁</a>
        </header>

        <section class="map-viewer" aria-label="廠區電子地圖">
            <img
                class="factory-map"
                src="images/electronic-map.png"
                alt="中國鋼鐵股份有限公司廠區佈置圖"
                onerror="this.hidden = true; document.querySelector('.map-missing').hidden = false;">
            <div class="map-missing" hidden>
                <h2>尚未載入地圖圖片</h2>
                <p>請將提供的電子地圖圖片放入 <code>images/electronic-map.png</code>。</p>
            </div>
        </section>
    </main>
</body>
</html>
