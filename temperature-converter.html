<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b1118">
    <title>溫度／RTD／TC換算 | 現場工具</title>
    <link rel="stylesheet" href="converter-tools.css">
    <link rel="stylesheet" href="redesign.css">
    <script src="redesign.js"></script>
</head>
<body class="converter-page">
    <div class="tool-shell" data-tool="temperature">
        <header class="tool-topline">
            <div class="tool-brand">
                <span class="tool-brand-mark" aria-hidden="true">↗</span>
                <span>現場換算工具</span>
            </div>
            <nav class="tool-nav" aria-label="換算工具">
                <a href="pressure-converter.html">壓力</a>
                <a href="4-20ma-converter.html">4–20</a>
                <a href="temperature-converter.html" aria-current="page">溫度</a>
            </nav>
        </header>

        <main>
            <h1 class="tool-heading">溫度／RTD／TC換算</h1>
            <p class="tool-intro">輸入溫度或感測器訊號，各項換算值即時同步更新。</p>

            <section class="tool-card" aria-label="溫度與感測器換算器">
                <label class="temperature-unit-picker">
                    <span>溫度單位</span>
                    <select class="tool-select" data-temperature-unit aria-label="溫度單位">
                        <option value="°C" selected>°C</option>
                        <option value="°F">°F</option>
                    </select>
                </label>

                <div class="temperature-fields">
                    <label>
                        <span class="field-label">溫度</span>
                        <span class="field-control">
                            <input class="tool-input" data-temperature-value type="number" inputmode="decimal" step="any" value="100" autocomplete="off">
                            <span class="range-unit" data-temperature-input-unit>°C</span>
                        </span>
                    </label>
                </div>

                <div class="temperature-result-grid">
                    <label class="temperature-output-card">
                        <span class="temperature-output-label">Pt100</span>
                        <span class="temperature-output-input">
                            <input class="temperature-signal-input" data-pt-value type="number" inputmode="decimal" step="any" value="138.5055" aria-label="Pt100電阻">
                            <small>Ω</small>
                        </span>
                        <small class="temperature-card-note" data-pt-note></small>
                    </label>
                    <label class="temperature-output-card">
                        <span class="temperature-output-label">Type K</span>
                        <span class="temperature-output-input">
                            <input class="temperature-signal-input" data-k-value type="number" inputmode="decimal" step="any" value="4.0962" aria-label="Type K熱電偶毫伏值">
                            <small>mV</small>
                        </span>
                        <small class="temperature-card-note" data-k-note></small>
                    </label>
                    <label class="temperature-output-card">
                        <span class="temperature-output-label">Type R</span>
                        <span class="temperature-output-input">
                            <input class="temperature-signal-input" data-r-value type="number" inputmode="decimal" step="any" value="0.6474" aria-label="Type R熱電偶毫伏值">
                            <small>mV</small>
                        </span>
                        <small class="temperature-card-note" data-r-note></small>
                    </label>
                </div>
                <input class="tool-range" data-temperature-slider type="range" min="-270" max="1768.1" step="0.1" value="100" aria-label="拖曳選擇溫度">
                <div class="slider-endpoints"><span data-temperature-low-label>-270 °C</span><span data-temperature-high-label>1,768.1 °C</span></div>
                <p class="temperature-forward-note" data-forward-note>輸入 100 °C</p>
            </section>
            <p class="tool-footnote">Pt100：IEC 60751；熱電偶 K／R：NIST ITS-90，參考端 0 °C。超出各型式標準量程時會提示。</p>
        </main>
    </div>
    <script src="converter-tools.js"></script>
</body>
</html>
